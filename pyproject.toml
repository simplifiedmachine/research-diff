[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "research-diff"
version = "0.1.0.dev0"
description = "Maps your research from its notes, experiment configs, results and paper (questions, hypotheses, experiments, results, claims) and shows what each iteration changed. Built for exploring ideas with AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "simplifiedmachine" }]
keywords = ["research", "experiment-tracking", "hypotheses", "reproducibility", "ai-agents", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
# Its pictures, snapshots and live page are system-diff's (same author, no dependencies of its own), pinned.
dependencies = ["system-diff @ git+https://github.com/simplifiedmachine/system-diff@59936d6446e74b4219f54d13fd92243e3d8df604"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
dev = ["pytest>=8", "mcp>=1.10"]

[project.urls]
Homepage = "https://github.com/simplifiedmachine/research-diff"
Documentation = "https://github.com/simplifiedmachine/research-diff/wiki"

[project.scripts]
research-diff = "research_diff.cli:main"
resdiff = "research_diff.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/research_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
