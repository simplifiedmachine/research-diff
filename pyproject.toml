[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "research-diff"
version = "0.5.0"
description = "Maps your research from its notes, experiment configs, results and paper, draws which evidence supports and which contradicts each claim of the paper, and shows what each iteration (and each agent) changed. Built for doing research with AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "simplifiedmachine" }]
keywords = ["research", "experiment-tracking", "hypotheses", "evidence", "argument-map", "contradictions", "reproducibility", "ai-agents", "multi-agent", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
# system-diff as a library: git reading, its pictures and LLM discovery (same author, no dependencies of its own). With
# a system-diff that has extensions (0.10+), research-diff also runs inside its page (host.merged()); not required.
dependencies = ["system-diff>=0.8.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
dev = ["pytest>=8", "mcp>=1.10"]

[project.urls]
Homepage = "https://github.com/simplifiedmachine/research-diff"
Documentation = "https://github.com/simplifiedmachine/research-diff/wiki"

# Inside system-diff's engine, page and pane when a system-diff with extensions is installed (system_diff_ext.py)
[project.entry-points."system_diff.extensions"]
research = "research_diff.system_diff_ext"

[project.scripts]
research-diff = "research_diff.cli:main"
resdiff = "research_diff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
