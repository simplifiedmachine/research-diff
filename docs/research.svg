<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="296" viewBox="0 0 1284 296" role="img" aria-label="Research map">
<style>
text { font-family: 'Segoe UI', FreeSans, 'Helvetica Neue', Arial, sans-serif; }
